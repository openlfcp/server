[package]
name = "lfcp-server"
description = "Application-agnostic OpenLFCP reference server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The LFCP protocol core from the sibling sdk-rs checkout, at the commit in
# sdk-rs.lock (checked by tests/sdk_rs_lock.rs). default-features = false
# keeps the shared-objects feature, and with it Automerge and Task
# semantics, out of the server (AGENT-OPERATING-GUIDE §6.4;
# tests/dependency_policy.rs).
lfcp = { path = "../../../sdk-rs/crates/lfcp", default-features = false }
# Async runtime: a multi-threaded runtime, TCP, signals for graceful
# shutdown, select!, channels and timers.
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time"] }
# HTTP/1.1 server for the health endpoint (and the WebSocket upgrade in
# LFCP-047). No TLS: it is terminated by a reverse proxy in front.
hyper = { version = "1.11", default-features = false, features = ["server", "http1"] }
# hyper's tokio I/O adapter.
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }
# WebSocket framing over hyper's upgraded connection (WIRE-01 §30, §31).
# "handshake" only for the Sec-WebSocket-Accept derivation; no TLS, no
# client connector.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# OS randomness for the server ID, nonces and session IDs (WIRE-01 §35).
getrandom = { version = "0.4", default-features = false }
# Structured logs; the level comes from the configuration (no env-filter,
# which would pull in regex).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
# SQLite for the store (LFCP-045), compiled in ("bundled") so no system
# library is needed. One connection, owned by one thread.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# The TOML configuration file.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
serde_json = "1"
