name: Image

# Publishes the server image (deploy/Dockerfile) to
# ghcr.io/openlfcp/lfcp-server for linux/amd64 and linux/arm64.
#
# - A pushed v* tag publishes <version> (v0.1.0 -> 0.1.0) and latest.
# - workflow_dispatch publishes the given tag, and latest unless unchecked.
#
# Each architecture builds on a native runner (a Rust release build under
# QEMU takes hours), pushes by digest and is smoke-tested by its health
# check; the merge job then joins the digests under the tags. Nothing is
# tagged unless both architectures built and passed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0)"
        required: true
        type: string
      latest:
        description: "Also move the latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  IMAGE: ghcr.io/openlfcp/lfcp-server

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # The CI layout the Dockerfile expects: server/ and sdk-rs/ side by
      # side, sdk-rs at the commit in server/sdk-rs.lock.
      - uses: actions/checkout@v4
        with:
          path: server
      - id: locks
        working-directory: server
        run: echo "sdk=$(jq -er .commit sdk-rs.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: openlfcp/sdk-rs
          ref: ${{ steps.locks.outputs.sdk }}
          path: sdk-rs
      - id: arch
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          # The parent of server/ and sdk-rs/; BuildKit reads
          # server/deploy/Dockerfile.dockerignore next to the Dockerfile.
          context: .
          file: server/deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.arch.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.arch.outputs.pair }}
      # The image starts, as its non-root user, and its own HEALTHCHECK
      # (lfcp-server --health-check) turns healthy.
      - name: Smoke test
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name smoke "$REF"
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs smoke
          [ "$status" = healthy ] || { echo "not healthy: $status"; exit 1; }
          [ "$(docker inspect -f '{{.Config.User}}' smoke)" = nonroot:nonroot ]
          docker rm -f smoke
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.arch.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.latest }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          [ ${#args[@]} -gt 0 ] || { echo "no tags to publish"; exit 1; }
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          [ ${#sources[@]} -eq 2 ] || { echo "expected 2 digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
      - name: Inspect
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: docker buildx imagetools inspect "$(head -n1 <<< "$TAGS")"
