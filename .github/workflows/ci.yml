name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
      # sdk-rs is a path dependency (../sdk-rs) at the commit in sdk-rs.lock;
      # the spec is read by tests (../spec) at the tag in spec.lock.
      - id: locks
        run: |
          echo "sdk=$(jq -er .commit sdk-rs.lock)" >> "$GITHUB_OUTPUT"
          echo "spec=$(jq -er .tag spec.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: openlfcp/sdk-rs
          ref: ${{ steps.locks.outputs.sdk }}
          path: sdk-rs
      # Full history with tags, so the tests can check that the tag still
      # resolves to the commit in spec.lock.
      - uses: actions/checkout@v4
        with:
          repository: openlfcp/spec
          ref: refs/tags/${{ steps.locks.outputs.spec }}
          path: spec
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes tests/dependency_policy.rs: no Automerge, no shared-objects.
      - run: cargo test --workspace

  # LFCP-055: build the image and run the compose check (non-root, health,
  # wss through the proxy, restart on the same volume, a destroyed volume).
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
      - id: locks
        working-directory: server
        run: |
          echo "sdk=$(jq -er .commit sdk-rs.lock)" >> "$GITHUB_OUTPUT"
          echo "spec=$(jq -er .tag spec.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: openlfcp/sdk-rs
          ref: ${{ steps.locks.outputs.sdk }}
          path: sdk-rs
      - uses: actions/checkout@v4
        with:
          repository: openlfcp/spec
          ref: refs/tags/${{ steps.locks.outputs.spec }}
          path: spec
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: server/deploy/check.sh
