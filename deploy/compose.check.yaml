# Overlay for deploy/check.sh only: publishes the server's port on
# loopback so the Rust test client (plain ws://) can drive it directly, and
# configures the test vectors' coordinator URLs.
services:
  lfcp-server:
    ports:
      - "127.0.0.1:${LFCP_CHECK_PORT:-17820}:7820"
    # The test vectors' coordinator URLs (server.check.toml), so the Rust
    # test client can host and coordinate their Resource.
    volumes:
      - ./server.check.toml:/etc/lfcp/server.toml:ro
