# lfcp-server configuration for the container (LFCP-055).
#
# Mounted at /etc/lfcp/server.toml by compose.yaml (also baked into the
# image as the default). See README "Running" for every setting.

# Inside the container; the TLS proxy reaches it on the compose network.
bind = "0.0.0.0:7820"
ws_path = "/v1/ws"
# The persistent volume.
state_dir = "/var/lib/lfcp"
log_level = "info"
# The wss:// URLs clients reach this server at, through the proxy. A
# Resource whose Control Coordinator URL is one of them is coordinated
# here (WIRE-01 §21). Set your host name for a real deployment.
public_urls = ["wss://localhost/v1/ws"]

# Abuse limits (POST-003; README "Running"). Only the proxy, at its fixed
# address on the compose network (compose.yaml), may report the client
# address, in X-Forwarded-For (deploy/Caddyfile overwrites it). Every
# other per-IP, rate, quota and storage limit keeps its default.
trusted_proxies = ["172.30.78.10"]
client_ip_header = "x-forwarded-for"
# The store's total cap, unset by default; set it below the volume size.
# max_total_bytes = 3221225472
