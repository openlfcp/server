# The OpenLFCP reference server behind a TLS proxy (LFCP-055).
#
#   docker compose -f deploy/compose.yaml up -d --build
#
# Run from server/ with sdk-rs/ checked out next to it (see README
# "Docker"). The state lives in the lfcp-state volume: recreating the
# containers keeps it; `down -v` destroys it (a new server).
name: openlfcp

services:
  lfcp-server:
    build:
      # The parent of server/ and sdk-rs/.
      context: ../..
      dockerfile: server/deploy/Dockerfile
    image: openlfcp/lfcp-server:dev
    volumes:
      - lfcp-state:/var/lib/lfcp
      - ./server.toml:/etc/lfcp/server.toml:ro
    restart: unless-stopped
    # Not published: clients reach it through the proxy only. The image's
    # HEALTHCHECK probes /health.
    networks:
      - lfcp

  proxy:
    image: caddy:2.10-alpine
    depends_on:
      lfcp-server:
        condition: service_healthy
    ports:
      - "${LFCP_HTTPS_PORT:-443}:443"
      - "${LFCP_HTTP_PORT:-80}:80"
    environment:
      LFCP_SITE: ${LFCP_SITE:-localhost}
      LFCP_TLS: ${LFCP_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      lfcp:
        # The one address server.toml trusts to report client IPs
        # (trusted_proxies). Change both together.
        ipv4_address: 172.30.78.10

# A fixed subnet, so the proxy has a fixed address (POST-003). Pick
# another if 172.30.78.0/24 is in use on the host, and update the proxy's
# address and server.toml.
networks:
  lfcp:
    ipam:
      config:
        - subnet: 172.30.78.0/24

volumes:
  lfcp-state:
  caddy-data:
  caddy-config:
